name: Deploy to Maven Central

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
      
      - name: Disable pinentry
        run: |
          cat << EOF > ~/.gnupg/gpg-agent.conf
          allow-loopback-pinentry
          default-cache-ttl 300
          max-cache-ttl 7200
          EOF

          echo "pinentry-program /usr/bin/pinentry-tty" >> ~/.gnupg/gpg-agent.conf

          gpg-connect-agent reloadagent /bye

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Decrypt settings.xml
        run: |
          echo "${{ secrets.MAVEN_SETTINGS_XML }}" | base64 -d > $HOME/.m2/settings.xml
        shell: bash

      - name: Validate settings.xml
        run: |
          cat $HOME/.m2/settings.xml
          test -s $HOME/.m2/settings.xml || (echo "ERROR: settings.xml is empty!" && exit 1)

      - name: Change Directory and Build
        run: |
          cd telegram-spring-boot-starter
          mvn --batch-mode --update-snapshots clean deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}